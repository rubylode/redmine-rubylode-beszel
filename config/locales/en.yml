en:
  rubylode_beszel:
    plugin_name: Rubylode Beszel
    status:
      all_up: All servers up
      some_down: "%{down} of %{known} down"
      unavailable: Status unavailable
      up: Up
      down: Down
      paused: Paused
      unknown: Unknown
      no_reading: "–"
    last_seen_ago: "%{time} ago"
    columns:
      server: Server
      description: Description
      status: Status
      last_seen: Last seen
      cpu: CPU
      memory: Memory
      disk: Disk
    hints:
      not_configured: "Server status is not set up yet. Add the Beszel hub URL in the plugin settings."
      not_configured_link: Open the settings
      reason: "Why: %{reason}"
    page_title: Server status
    errors:
      line_field_count: "needs %{count} fields separated by |, found %{found}"
      line_name_missing: the name is empty
      line_prefix: "Servers, line %{line_number}: %{message}"
      hub_url_invalid: The Beszel hub URL must start with http:// or https://
      environment_variable_invalid: "%{field} must start with BESZEL_ and use only capital letters, digits and underscores (Redmine's own secrets cannot be named here)"
      plain_http_refused: "A plain http:// hub URL is only accepted for localhost; use https://, or tick the box that allows plain http on an internal network"
      allowed_hosts_invalid: "The other allowed hosts must be host names, separated by spaces, commas or new lines"
      insecure_connection: "The hub URL is not https, so the credentials are not sent (see the plain http setting)"
      redirect_refused: "The hub redirected to a host that is not allowed, so the credentials were not sent there"
      number_invalid: "%{field} must be a whole number of at least %{minimum}"
      visibility_invalid: Who may see the block must be one of the listed choices
      block_title_blank: The block title cannot be empty
      credentials_missing: The Beszel email or password is not set
      sign_in_refused: The Beszel hub refused the sign-in
      hub_status: "The Beszel hub answered %{status}"
      hub_unreachable: "The Beszel hub could not be reached (%{error_class})"
      hub_answer_unreadable: The Beszel hub gave an answer that could not be read
      hub_did_not_answer: The Beszel hub did not answer
      column_invalid: The welcome page and Overview columns must be left or right
      path_line_prefix: "Show on pages, line %{line_number}: %{message}"
      path_must_start_with_slash: "a path must start with / (for example /issues)"
      path_has_host: "give the path only, without http:// or a host name"
      path_has_query: "leave out the ? and # parts, query strings are ignored"
      path_has_space: "a path cannot contain spaces"
      path_too_long: "a path can have at most %{maximum} characters"
      path_too_many: "at most %{maximum} paths can be listed"
    settings:
      hub_url: Beszel hub URL
      hub_url_hint: "For example https://beszel.example.com. Empty means the block is not shown to anyone but administrators, who get a hint."
      email_environment_variable: Name of the email environment variable
      email_environment_variable_hint: "The email of a Beszel user who may read the systems. It is never saved here: put it in this environment variable before Redmine starts."
      password_environment_variable: Name of the password environment variable
      password_environment_variable_hint: "The password of that user. It is never saved here either."
      allow_plain_http: Allow plain http
      allow_plain_http_hint: "Credentials go over https only, except to localhost. Tick this only when the hub is on an internal network you trust, so an http:// URL may carry them."
      allowed_hosts: Other allowed hosts
      allowed_hosts_hint: "Credentials are sent only to the host of the hub URL. If the hub redirects to another host (a second name for the same hub), list that host here. Optional."
      variable_is_not_allowed: "not allowed: the name must start with BESZEL_"
      variable_is_set: "set in the environment"
      variable_is_not_set: "not set in the environment"
      systems: Servers
      systems_hint: "Optional. One server per line: Name | system name in Beszel | Description. The Beszel name may be empty when it matches the name, the description too. Lines starting with # are ignored. Leave it empty to show every system the hub has."
      systems_example: |-
        Web | web-1 | The public site
        Database | db-1 | Primary database
      cache_seconds: Cache seconds
      cache_seconds_hint: "The hub is asked at most once in this many seconds."
      failure_cache_seconds: Failure cache seconds
      failure_cache_seconds_hint: "After a failed answer the hub is left alone for this long."
      timeout_seconds: Timeout seconds
      block_title: Block title
      visibility: Who may see the block
      visibility_logged_in: Everyone who is signed in
      visibility_admins: Administrators only
      placements_heading: Show the block on
      placements_intro: "Besides the macro, the page and the My page block, the block can be added to these pages. Every place follows the setting above for who may see it, and shares the cache, so the hub is still asked once in the cache window."
      show_on_welcome_page: Welcome page
      show_on_my_page: My page
      show_on_my_page_hint: "A small version at the top of My page, in addition to the block you can add yourself."
      show_on_project_overview: Project Overview page
      show_in_top_menu: Top menu link
      show_in_top_menu_hint: "Adds a link to the page /beszel_status in the top menu, named like the block title."
      column_left: Left column
      column_right: Right column
      show_on_paths: Pages matching these paths
      show_on_paths_hint: "One path per line; * stands for any text. Query strings and a trailing / are ignored. A small version of the block is drawn at the top of each matching page. Pages under /admin, /settings, /login and /account only match a path that itself starts with that prefix."
      show_on_paths_example: |-
        /issues
        /projects/*/issues
      help_heading: How to show the block on other pages
      help_place: Where
      help_how: How
      help_needs_setting: Needs a setting
      help_macro_intro: "Paste the macro into any text that Redmine formats with its wiki syntax; add a title to override the block title:"
      help_welcome_text: "The welcome text (Administration, Settings, General) is rendered with textilizable like a wiki page, so the macro works there too. In Redmine 7.0.2 the welcome page view calls textilizable on the welcome text, and news, project descriptions, issue descriptions and comments are rendered the same way."
      help_partial_intro: "In a theme or another plugin's view, render the partial. It draws nothing for people who may not see the block:"
      help_partial_locals: "Locals, all optional: title (text that replaces the block title), show_title (false hides the title), compact (true gives the small variant without description and last seen columns)."
      help_page_link: "The standalone page is /beszel_status. Link to it from any wiki text with:"
      help_rows:
        wiki:
          place: Wiki pages
          how: "The macro {{beszel_status}}"
          setting: "No"
        news:
          place: News, issue descriptions and comments
          how: "The macro {{beszel_status}}"
          setting: "No"
        descriptions:
          place: Project descriptions
          how: "The macro {{beszel_status}}, it then shows on the project's Overview page"
          setting: "No"
        welcome_text:
          place: "The welcome text (Administration, Settings, General)"
          how: "The macro {{beszel_status}}"
          setting: "No"
        my_page_block:
          place: "My page, as a block you move around"
          how: "Pick Server status in the Add list of My page"
          setting: "No"
        welcome_page:
          place: Welcome page, left or right column
          how: Tick the box above
          setting: "Welcome page"
        my_page:
          place: My page, a small version at the top
          how: Tick the box above
          setting: "My page"
        overview:
          place: Project Overview page, left or right column
          how: Tick the box above
          setting: "Project Overview page"
        paths:
          place: Any other page, such as the issue list
          how: "List its path, for example /issues or /projects/*/issues"
          setting: "Pages matching these paths"
        page:
          place: Its own page
          how: "Open /beszel_status"
          setting: "No"
        top_menu:
          place: The top menu
          how: Tick the box above
          setting: "Top menu link"
        partial:
          place: A theme or another plugin
          how: 'render partial: "rubylode_beszel/status"'
          setting: "No"
  my:
    blocks:
      rubylode_beszel_status: Server status
